services:
  scylla:
    image: scylladb/scylla
    hostname: scylla
    ports:
      - "9042:9042"
      - "8000:8000"
    command: ["--alternator-address", "0.0.0.0", "--alternator-port", "8000", "--alternator-write-isolation", "always"]
    volumes:
      - scylla_data:/var/lib/scylla

  faas:
    image: tliesche/function-as-a-service:develop
    hostname: faas
    ports:
      - "8080:8080"
    environment:
      - CLOUD_TOOLBOX_COMPONENT_ID=hello-world-faas
      - FUNCTION_AS_A_SERVICE_COMMAND=/usr/local/bin/hello-world-faas
      - FUNCTION_AS_A_SERVICE_PARALLEL_EXECUTION=2
      - FUNCTION_AS_A_SERVICE_EXECUTION_TIMEOUT=10
      - LOG_DEV_MODE=true
      - LOG_LEVEL=trace
      - LOG_PATH=/dev/stdout

volumes:
  scylla_data:
    driver: local
