services:
  faas:
    image: tliesche/function-as-a-service:develop
    hostname: faas
    ports:
      - "8080:8080"
    environment:
      - CLOUD_TOOLBOX_COMPONENT_ID=hello-world-faas
      - FUNCTION_AS_A_SERVICE_COMMAND=/usr/local/bin/hello-world-faas
      - FUNCTION_AS_A_SERVICE_PARALLEL_EXECUTION=2
      - FUNCTION_AS_A_SERVICE_EXECUTION_TIMEOUT=10
      - FUNCTION_AS_A_SERVICE_STORAGE_BACKEND=redis
      - FUNCTION_AS_A_SERVICE_STORAGE_TTL=10
      - SCYLLA_USERNAME=faas
      - SCYLLA_PASSWORD=faaspass
      - SCYLLA_HOST=scylla
      - SCYLLA_TABLE=function_as_a_service_executions
      - SCYLLA_PORT=8000
      - SCYLLA_REGION=eu-central-1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_DEV_MODE=true
      - LOG_LEVEL=trace
      - LOG_PATH=/dev/stdout

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:8.0-M04-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  scylla:
    image: scylladb/scylla:6.2
    hostname: scylla
    ports:
      - "9042:9042"
      - "8000:8000"
    command: ["--alternator-address", "0.0.0.0", "--alternator-port", "8000", "--alternator-write-isolation", "always"]
    volumes:
      - scylla_data:/var/lib/scylla

volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  scylla_data:
    driver: local
